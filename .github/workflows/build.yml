name: Build and test Fabric 1.21.1

on:
  push:
    paths-ignore: ['docs/**', 'README.md', 'MODLOG.md', 'AGENTS.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'MODLOG.md', 'AGENTS.md']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: fabric-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle21
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Restore Gradle dependencies, Loom mappings and task outputs
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deterministic image conversion dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Validate asset references and conversion
        run: |
          set -o pipefail
          python -B scripts/porting/record_verification.py --begin-run .tmp/ci-inputs.json
          python -B scripts/porting/convert_assets.py --verify
          python -B -m unittest discover -s scripts/porting -p 'test_*.py' 2>&1 | tee .tmp/ci-assets.log
      - name: Build Fabric and run fresh JUnit and GameTest checks
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain --build-cache :common:test --rerun :fabric:clientTestClasses :fabric:build :fabric:runGameTest 2>&1 | tee .tmp/ci-validate.log
          python -c 'from pathlib import Path; Path(".tmp/ci-exit.json").write_text("{\"code\":0}\n", encoding="utf-8")'
      - name: Show failed game tests with their messages
        if: always()
        run: |
          python -B - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path("fabric/build/gametest-results.xml")
          if not report.exists():
              print("no game-test report:", report)
          else:
              failed = [case for case in ET.parse(report).getroot().iter("testcase") if case.find("failure") is not None or case.find("error") is not None]
              print(len(failed), "failed game tests in the report")
              for case in failed:
                  for child in case:
                      if child.tag in ("failure", "error"):
                          print("-", case.get("name"), case.get("time") + "s", child.tag, dict(child.attrib))
                          print("   ", " ".join((child.text or "").split())[:1500])
          PY
      - name: Verify fresh results, required cases and packaged attribution
        run: >-
          python -B scripts/porting/record_verification.py
          --loaders fabric
          --run-snapshot .tmp/ci-inputs.json
          --build-exit-json .tmp/ci-exit.json
          --build-log .tmp/ci-validate.log
          --asset-test-log .tmp/ci-assets.log
      - name: Keep logs and reports for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-validation-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .tmp/ci-*.json
            .tmp/ci-*.log
            common/build/test-results/test/
            common/build/reports/tests/test/
            fabric/build/gametest-results.xml
            fabric/run-gametest/logs/
            docs/porting/verification.json
