name: Build and test Minecraft 1.21.1

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle21
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate asset references and conversion
        run: |
          python -B scripts/porting/record_verification.py --begin-run .tmp/ci-inputs.json
          python -B scripts/porting/convert_assets.py --verify
          python -B -m unittest discover -s scripts/porting -p 'test_*.py' 2>&1 | tee .tmp/ci-assets.log
      - name: Compile, build and run both native GameTest servers
        run: |
          ./scripts/dev.sh validate --rerun-tasks 2>&1 | tee .tmp/ci-validate.log
          python -c 'from pathlib import Path; Path(".tmp/ci-exit.json").write_text("{\"code\":0}\n", encoding="utf-8")'
      - name: Show failed game tests with their messages
        if: always()
        run: |
          python -B - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path("fabric/build/gametest-results.xml")
          if not report.exists():
              print("no game-test report:", report)
          else:
              failed = [case for case in ET.parse(report).getroot().iter("testcase") if case.find("failure") is not None or case.find("error") is not None]
              print(len(failed), "failed game tests in the report")
              for case in failed:
                  for child in case:
                      if child.tag in ("failure", "error"):
                          print("-", case.get("name"), case.get("time") + "s", child.tag, dict(child.attrib))
                          print("   ", " ".join((child.text or "").split())[:1500])
          PY
      - name: Verify fresh results, required cases and packaged attribution
        run: >-
          python -B scripts/porting/record_verification.py
          --run-snapshot .tmp/ci-inputs.json
          --build-exit-json .tmp/ci-exit.json
          --build-log .tmp/ci-validate.log
          --asset-test-log .tmp/ci-assets.log
