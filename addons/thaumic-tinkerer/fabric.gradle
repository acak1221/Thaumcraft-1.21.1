// Thaumic Tinkerer for Fabric: a separate mod (id thaumictinkerer) that is built next to Thaumcraft 4 Reload and
// depends on it through thaumcraft.api only. This script works in two builds, from the same file:
//
//  * the monorepo (Thaumcraft-1.21.1): applied from fabric/build.gradle, so it runs in the :fabric project and sees its Loom
//    setup, exactly like the exampleAddon source set of that file. The add-on directory is addons/thaumic-tinkerer, and
//    sourceSets.main is Thaumcraft's own Fabric code.
//  * the standalone repository (Thaumic-Tinkerer-1.21.1): applied from the build.gradle at its root, which is the add-on
//    directory. There is one Gradle project and sourceSets.main is the (empty) main source set of the Java plugin; Thaumcraft
//    arrives as the jar thaumcraft:Thaumcraft-fabric:<thaumcraft_version> (modImplementation, mavenLocal) with Minecraft, Fabric
//    Loader, Fabric API and Architectury, so the compile classpath of sourceSets.main means the same thing in both.
//
// Everything below therefore uses sourceSets.main only through its output and its compile/runtime classpath, and finds the
// add-on directory from the location of this file, never from rootProject.
//
// The sources of the add-on are the loader-neutral tree common and the Fabric entrypoints in fabric (both in the add-on
// directory). There is no NeoForge build of the add-on yet (no neoforge.gradle; nothing in neoforge/build.gradle names the
// add-on); a NeoForge build is meant to compile the same common tree.
//
// This build script is a build file of Thaumcraft 4 Reload (MIT); the add-on sources it compiles are under
// CC BY-NC-SA 3.0 (LICENSE in the add-on directory).

// The add-on directory: where this script lives (addons/thaumic-tinkerer in the monorepo, the project root in the standalone).
def ttDir = buildscript.sourceFile.parentFile.canonicalFile

sourceSets {
 thaumicTinkerer {
  java.srcDirs = [new File(ttDir, 'common/src/main/java'), new File(ttDir, 'fabric/src/main/java')]
  resources.srcDirs = [new File(ttDir, 'common/src/main/resources'), new File(ttDir, 'fabric/src/main/resources')]
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 }
 // Runtime assertions of the add-on, run by the tinkererGameTest server (see below).
 thaumicTinkererGameTest {
  java.srcDirs = [new File(ttDir, 'common/src/gameTest/java'), new File(ttDir, 'fabric/src/gameTest/java')]
  // fabric/...: the harness mod (fabric.mod.json, mixins); common/...: the parity oracle (tt_oracle/*.json) extracted from the 1.7.10 source
  resources.srcDirs = [new File(ttDir, 'fabric/src/gameTest/resources'), new File(ttDir, 'common/src/gameTest/resources')]
  compileClasspath += sourceSets.thaumicTinkerer.output + sourceSets.thaumicTinkerer.compileClasspath
  runtimeClasspath += sourceSets.thaumicTinkerer.output + sourceSets.thaumicTinkerer.runtimeClasspath
 }
 // The client smoke harness of the add-on (docs/CLIENT_VERIFICATION.md in the add-on directory): runs a real client under
 // Xvfb and looks at the models, textures, translations, screens and renderers. Compiled by check, loaded only by the
 // tinkererClientSmoke run; no jar task includes its output.
 thaumicTinkererClientSmoke {
  java.srcDirs = [new File(ttDir, 'fabric/src/clientSmoke/java')]
  resources.srcDirs = [new File(ttDir, 'fabric/src/clientSmoke/resources')]
  compileClasspath += sourceSets.thaumicTinkerer.output + sourceSets.thaumicTinkerer.compileClasspath
  runtimeClasspath += sourceSets.thaumicTinkerer.output + sourceSets.thaumicTinkerer.runtimeClasspath
 }
 // JUnit tests of the add-on's plain logic.
 thaumicTinkererTest {
  // The plain-Java comparison logic of the parity check lives in the GameTest tree (common/src/gameTest/java/.../testing/parity)
  // so the GameTest can use it; the unit tests compile it too (nothing else of that tree: the checks need a world) and read the
  // oracle from the same resource directory.
  java.srcDirs = [new File(ttDir, 'common/src/test/java'), new File(ttDir, 'common/src/gameTest/java')]
  java.exclude 'thaumic/tinkerer/testing/*.java', 'thaumic/tinkerer/fabric/**'
  resources.srcDirs = [new File(ttDir, 'common/src/test/resources'), new File(ttDir, 'common/src/gameTest/resources')]
  compileClasspath += sourceSets.thaumicTinkerer.output + sourceSets.thaumicTinkerer.compileClasspath
  runtimeClasspath += sourceSets.thaumicTinkerer.output + sourceSets.thaumicTinkerer.runtimeClasspath
 }
}

dependencies {
 thaumicTinkererTestImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
 thaumicTinkererTestImplementation 'org.junit.platform:junit-platform-launcher'
 thaumicTinkererTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processThaumicTinkererResources') {
 inputs.property 'version', project.version
 filesMatching('fabric.mod.json') { expand version: project.version }
 // The licence travels with every artifact of the add-on.
 from(ttDir) { include 'LICENSE'; into 'META-INF' }
}
tasks.named('check') { dependsOn 'compileThaumicTinkererJava', 'compileThaumicTinkererGameTestJava', 'compileThaumicTinkererClientSmokeJava' }

// Mixin refmap of the add-on (the mixins are in fabric/src/main/java/thaumic/tinkerer/fabric/mixin of the add-on directory,
// the config is fabric/src/main/resources/thaumictinkerer.mixins.json, listed under "mixins" of its fabric.mod.json).
// Loom (architectury-loom 1.11) puts EVERY source set that exists when it initialises on the Mixin annotation processor, each
// with its own refmap named <sourceSet>-<archivesName>[-<project>]-refmap.json next to the classes (in the monorepo
// thaumicTinkerer-Thaumcraft-fabric-fabric-refmap.json; in the standalone, whose single project is the root project,
// thaumicTinkerer-ThaumicTinkerer-refmap.json).
// The processor of the source set carries MixinExtras as well, so @WrapOperation / @WrapMethod / @Local are in the refmap.
// remapThaumicTinkererJar then adds "refmap" to the mixin config in the jar (MixinRefmapService: the config is listed in
// fabric.mod.json and the jar holds the refmap), so nothing has to be declared here. Do NOT call
// loom.mixin.add(sourceSet, name) for this source set: the first explicit add() switches the defaults off for all the other
// source sets, Thaumcraft's own included (their refmaps would stop being written).
// What this does is to fail the compile if the processor wrote no refmap, or one without an entry for a mixin that has an
// injector (@Inject, @WrapOperation, @WrapMethod, @Accessor, ...), so a production jar cannot silently lose its remapping.
tasks.named('compileThaumicTinkererJava') {
 doLast {
  def mixinDir = new File(ttDir, 'fabric/src/main/java/thaumic/tinkerer/fabric/mixin')
  def mixinFiles = mixinDir.exists() ? mixinDir.listFiles({ File f -> f.name.endsWith('.java') } as FileFilter).toList() : []
  def withInjectors = mixinFiles.findAll { it.getText('UTF-8') =~ /@(Inject|WrapOperation|WrapMethod|ModifyVariable|ModifyArg|ModifyReturnValue|ModifyExpressionValue|Redirect|Accessor|Invoker)\b/ }
  if (!withInjectors.isEmpty()) {
   def refmaps = destinationDirectory.get().asFile.listFiles({ File f -> f.name.endsWith('-refmap.json') } as FileFilter)
   if (refmaps == null || refmaps.length == 0) {
    throw new GradleException('Thaumic Tinkerer has mixins but the Mixin annotation processor wrote no refmap into ' + destinationDirectory.get().asFile)
   }
   def mapped = new groovy.json.JsonSlurper().parse(refmaps[0], 'UTF-8').mappings.keySet()
   def missing = withInjectors.collect { 'thaumic/tinkerer/fabric/mixin/' + (it.name - '.java') }.findAll { !mapped.contains(it) }
   if (!missing.isEmpty()) throw new GradleException('The refmap ' + refmaps[0].name + ' has no entry for ' + missing)
  }
 }
}

def tinkererModRoots = files(sourceSets.thaumicTinkerer.output)
// Fabric Loader reads one mod per classpath group: groups are separated by a doubled path separator.
def tinkererGameTestGroups = tinkererModRoots.asPath + File.pathSeparator + File.pathSeparator + files(sourceSets.thaumicTinkererGameTest.output).asPath
def tinkererGameTestFilter = providers.gradleProperty('tinkererGameTestFilter').getOrElse('')
// The client smoke: the add-on is one mod, the harness another (a second classpath group), exactly like the GameTest harness.
def tinkererClientSmokeGroups = tinkererModRoots.asPath + File.pathSeparator + File.pathSeparator + files(sourceSets.thaumicTinkererClientSmoke.output).asPath
def tinkererClientSmokeOut = layout.buildDirectory.dir('tinkerer-client-smoke').get().asFile
// The harness stops itself after this many seconds with a partial report and a non-zero exit (the watchdog).
def tinkererClientSmokeTimeout = providers.gradleProperty('tinkererClientSmokeTimeout').getOrElse('1500')

loom.runs {
 // The development client with Thaumic Tinkerer loaded next to Thaumcraft.
 tinkererClient {
  client()
  source sourceSets.thaumicTinkerer
  name 'Thaumic Tinkerer client'
  runDir 'run-tinkerer-client'
  vmArg "-Dfabric.classPathGroups=${tinkererModRoots.asPath}"
 }
 // The client smoke harness (docs/CLIENT_VERIFICATION.md): a real client with a 1280x720 window, started by
 // tools/client-smoke.sh under Xvfb. Its run directory is git-ignored; the results go to build/tinkerer-client-smoke.
 tinkererClientSmoke {
  client()
  vmArg '-Xmx3G'
  source sourceSets.thaumicTinkererClientSmoke
  name 'Thaumic Tinkerer client smoke'
  runDir 'run-tinkerer-clientsmoke'
  vmArg "-Dfabric.classPathGroups=${tinkererClientSmokeGroups}"
  vmArg '-Dthaumictinkerer.clientSmoke=true'
  vmArg "-Dthaumictinkerer.clientSmoke.outDir=${tinkererClientSmokeOut.absolutePath}"
  vmArg "-Dthaumictinkerer.clientSmoke.sourceRoot=${ttDir.absolutePath}"
  vmArg "-Dthaumictinkerer.clientSmoke.timeoutSeconds=${tinkererClientSmokeTimeout}"
  programArgs '--width', '1280', '--height', '720'
 }
 // Server-side runtime assertions of the add-on. The Thaumcraft suites are not loaded.
 tinkererGameTest {
  server()
  vmArg '-Xmx3G'
  source sourceSets.thaumicTinkererGameTest
  name 'Thaumic Tinkerer GameTests'
  vmArg "-Dfabric.classPathGroups=${tinkererGameTestGroups}"
  vmArg '-Dfabric-api.gametest'
  if (!tinkererGameTestFilter.isBlank()) vmArg "-Dthaumictinkerer.gameTestFilter=${tinkererGameTestFilter}"
  vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('tinkerer-gametest-results.xml').get().asFile.absolutePath}"
  runDir 'run-tinkerer-gametest'
 }
}
tasks.named('runTinkererGameTest') {
 dependsOn tasks.named('thaumicTinkererGameTestClasses')
 // Every run starts on a new world, so that no result depends on what an earlier run left in it.
 doFirst { delete file('run-tinkerer-gametest/world') }
}

// The owned run directory of the client smoke: fixed options (English, GUI scale 2, no sound, small view distance),
// a clean output directory. The singleplayer world is made by the harness itself and is deleted first.
tasks.register('prepareTinkererClientSmoke') {
 group = 'verification'
 description = 'Resets run-tinkerer-clientsmoke/options.txt and the result directory of the Thaumic Tinkerer client smoke.'
 doLast {
  def runDir = file('run-tinkerer-clientsmoke')
  runDir.mkdirs()
  new File(runDir, 'options.txt').setText('onboardAccessibility:false\nlang:en_us\nguiScale:2\npauseOnLostFocus:false\n' +
    'renderDistance:8\nsimulationDistance:6\nmaxFps:60\nenableVsync:false\ntutorialStep:none\nnarrator:0\n' +
    'soundCategory_master:0.0\nskipMultiplayerWarning:true\nhideBundleTutorial:true\n', 'UTF-8')
  delete new File(runDir, 'saves')
  delete tinkererClientSmokeOut
  tinkererClientSmokeOut.mkdirs()
 }
}
tasks.named('runTinkererClientSmoke') {
 dependsOn tasks.named('thaumicTinkererClientSmokeClasses'), tasks.named('prepareTinkererClientSmoke')
 // The exit code says whether the harness itself completed; what the checks found is in report.json, not here.
 doLast {
  def report = new File(tinkererClientSmokeOut, 'report.json')
  if (!report.isFile()) throw new GradleException("The client smoke wrote no report: ${report}")
  def status = new groovy.json.JsonSlurper().parse(report, 'UTF-8').harness?.status
  if (status != 'COMPLETED') throw new GradleException("The client smoke harness did not complete (status ${status}); see ${report}")
  logger.lifecycle("Thaumic Tinkerer client smoke: harness completed, results in ${report}")
 }
}

tasks.register('tinkererTest', Test) {
 group = 'verification'
 description = 'JUnit tests of the Thaumic Tinkerer add-on.'
 testClassesDirs = sourceSets.thaumicTinkererTest.output.classesDirs
 classpath = sourceSets.thaumicTinkererTest.runtimeClasspath
 useJUnitPlatform()
 workingDir = ttDir
 // Tests read the documents (KnownDifferencesTest), the language fragments and the source trees from the working directory. They are
 // inputs of the task, else Gradle takes a run for up to date (or restores it from the build cache) after a document was edited.
 // Not inputs: what the builds and runs write into that directory (in the standalone it is the project root).
 inputs.files(fileTree(ttDir) { exclude '.git/**', '.gradle/**', '.tmp/**', '**/logs/**', '**/*.log', '**/build/**', '**/run*/**', '**/__pycache__/**' }).withPropertyName('addonTree').withPathSensitivity(PathSensitivity.RELATIVE)
}

// The release jar: the add-on's own classes and resources, remapped like the Thaumcraft jar. Thaumcraft itself is
// a separate download that the add-on depends on.
def thaumicTinkererJar = tasks.register('thaumicTinkererJar', Jar) {
 archiveBaseName = 'ThaumicTinkerer-fabric'
 archiveClassifier = 'dev'
 from sourceSets.thaumicTinkerer.output
}
// The applied script does not see the Loom classes by name; the type of the existing remapJar task is the same class.
def remapJarType = tasks.named('remapJar').get().getClass().superclass
tasks.register('remapThaumicTinkererJar', remapJarType) {
 group = 'build'
 description = 'The remapped Thaumic Tinkerer jar for Fabric.'
 dependsOn thaumicTinkererJar
 inputFile.set thaumicTinkererJar.flatMap { it.archiveFile }
 archiveBaseName = 'ThaumicTinkerer-fabric'
 archiveClassifier = ''
 addNestedDependencies = false
}

// The compile classpath of the add-on, for tools/compile.sh: javac straight on the sources is much faster than
// Gradle for a tight edit-compile loop and lets several people (or agents) compile at the same time without
// sharing a Gradle lock. Re-run this task after a dependency change.
tasks.register('exportTinkererClasspath') {
 group = 'help'
 description = 'Writes the compile classpath of the add-on to .tmp in the add-on directory (it never compiles the add-on).'
 // Thaumcraft (its classes in the monorepo, its jar in the standalone), Minecraft, Architectury and Fabric. The add-on's own
 // output is deliberately not on it: tools/compile.sh compiles the add-on sources together.
 def mainCp = sourceSets.main.output.classesDirs + sourceSets.main.compileClasspath
 def outDir = new File(ttDir, '.tmp')
 inputs.files(mainCp)
 outputs.files(new File(outDir, 'classpath.txt'), new File(outDir, 'classpath-gametest.txt'))
 doLast {
  outDir.mkdirs()
  def text = mainCp.files.findAll { it.exists() }.join(File.pathSeparator)
  new File(outDir, 'classpath.txt').text = text
  new File(outDir, 'classpath-gametest.txt').text = text
 }
}
