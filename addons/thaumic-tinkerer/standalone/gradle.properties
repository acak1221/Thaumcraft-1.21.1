# SPDX-License-Identifier: MIT
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.caching=true

# The add-on. In the monorepo the add-on takes the version of Thaumcraft (mod_version of its gradle.properties); here it has its own.
mod_version=0.1.0-alpha.7
maven_group=thaumictinkerer
archives_name=ThaumicTinkerer

# The platform: the same versions as the Thaumcraft 4 Reload build (gradle.properties there).
minecraft_version=1.21.1
fabric_loader_version=0.16.14
fabric_api_version=0.116.17+1.21.1
architectury_api_version=13.0.11

# Thaumcraft 4 Reload, installed into ~/.m2 by `./gradlew :fabric:publishToMavenLocal` in a checkout of
# https://github.com/acak1221/Thaumcraft-1.21.1 (tools/publish-thaumcraft.sh and the CI build exactly the commit thaumcraft_ref).
# The add-on needs extensions of thaumcraft.api that exist only on the branch claude/hopeful-hamilton-v8m5pi of that repository, so a
# Thaumcraft of another branch or a release without them does not compile it. thaumcraft_ref is a commit (not the branch, which moves) of
# that branch; move thaumcraft_ref and thaumcraft_version (mod_version of that commit) together.
thaumcraft_version=0.1.0-alpha.7
thaumcraft_ref=36a450c405c69bb453c6cb67fc0b6bc3ab323c3f
