pluginManagement {
 // The same plugin repositories as the Thaumcraft build, so that Architectury Loom resolves the same way.
 repositories {
  maven { url = 'https://maven.fabricmc.net/' }
  maven { url = 'https://maven.architectury.dev/' }
  maven { url = 'https://maven.neoforged.net/releases/' }
  gradlePluginPortal()
  mavenCentral()
 }
}
rootProject.name = 'thaumic-tinkerer'
