plugins {
 id 'dev.architectury.loom' version '1.11.458' apply false
 id 'architectury-plugin' version '3.4.162'
 id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}
architectury { minecraft = minecraft_version }
allprojects { group = rootProject.maven_group; version = rootProject.mod_version }
subprojects {
 apply plugin: 'dev.architectury.loom'
 apply plugin: 'architectury-plugin'
 apply plugin: 'maven-publish'
 base { archivesName = rootProject.archives_name + '-' + project.name }
 repositories {
  mavenCentral()
  maven { url = 'https://maven.architectury.dev/' }
  maven { url = 'https://maven.fabricmc.net/' }
  maven { url = 'https://maven.neoforged.net/releases/' }
  // Optional recipe viewer API (EMI); compile-only, never bundled.
  maven { url = 'https://maven.terraformersmc.com/releases/'; content { includeGroup 'dev.emi'; includeGroup 'com.terraformersmc' } }
 }
 dependencies {
  minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
  mappings loom.officialMojangMappings()
 }
 java { toolchain { languageVersion = JavaLanguageVersion.of(21) }; withSourcesJar() }
 tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
 tasks.withType(Test).configureEach {
  useJUnitPlatform()
  // The isolation rules of the JUnit suite read the GameTest harness of the common module
  // (common/src/test/java/thaumcraft/integration/GameTestIsolationTest), so a change of the
  // harness has to run the suite again.
  def harness = project.file('src/gameTest/java')
  if (harness.exists()) inputs.dir(harness).withPropertyName('gameTestHarness')
 }
}
tasks.register('build') { group = 'build'; dependsOn ':common:build', ':fabric:build', ':neoforge:build' }
