tasks.named('runMultiplayerClient') {
 dependsOn tasks.named('prepareMultiplayerRun'), tasks.named('clientTestClasses')
 doLast {
  def reportFile = file('run-multiplayer/multiplayer-client-report.json')
  if (!reportFile.isFile()) {
   throw new GradleException("The multiplayer client produced no report; inspect ${file('run-multiplayer/logs/latest.log')}")
  }
  def report = new groovy.json.JsonSlurper().parse(reportFile, 'UTF-8')
  if (report.status != 'SCRIPT_PASSED' && !multiplayerAllowPartial) {
   throw new GradleException("The multiplayer acceptance failed: ${report.steps}; ${report.failures}")
  }
  logger.lifecycle("Multiplayer acceptance passed against ${report.address} as ${report.player}: ${report.steps}")
 }
}
