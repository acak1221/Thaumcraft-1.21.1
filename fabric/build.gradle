 doFirst {
  def smokeRunId = 'client-smoke-' + java.util.UUID.randomUUID().toString()
  extensions.extraProperties.set('clientSmokeRunId', smokeRunId)
   systemProperty 'thaumcraft.clientSmokeRunId', smokeRunId
   systemProperty 'thaumcraft.clientSmokeScope', clientSmokeScope
  file('run-clienttest/client-smoke-result.json').setText(groovy.json.JsonOutput.toJson([
    status: 'LAUNCHING', run_id: smokeRunId, visual_inspection: 'pending'
  ]) + '\n', 'UTF-8')
 }
 doLast {
  def resultFile = file('run-clienttest/client-smoke-result.json')
  def result = new groovy.json.JsonSlurper().parse(resultFile, 'UTF-8')
   if (result.run_id != extensions.extraProperties.get('clientSmokeRunId') || result.status != 'SCRIPT_PASSED' || result.scope != clientSmokeScope) {
   throw new GradleException("Client smoke failed or did not produce fresh evidence; inspect $resultFile")
  }
         def expectedCaptures = clientSmokeScope in ['visnet', 'focal', 'bore'] ? 10 : clientSmokeScope in ['tubefilter', 'buffer', 'centrifuge', 'crystallizer', 'stabilizer'] ? 8 : clientSmokeScope in ['voidjar', 'valve'] ? 7 : clientSmokeScope == 'frost' ? 5 : clientSmokeScope == 'excavation' ? 6 : clientSmokeScope == 'clothing' ? 8 : clientSmokeScope in ['caps', 'goggles'] ? 7 : clientSmokeScope == 'equipment' ? 6 : 66
   if (!(result.screenshots instanceof List) || result.screenshots.size() != expectedCaptures) {
    throw new GradleException("Client $clientSmokeScope check did not produce $expectedCaptures screenshots; inspect $resultFile")
  }
  def screenshotRoot = file('run-clienttest/screenshots').toPath().toAbsolutePath().normalize()
   result.screenshots.each { screenshot ->
   def screenshotPath = java.nio.file.Path.of(screenshot.path as String).toAbsolutePath().normalize()
   if (!screenshotPath.startsWith(screenshotRoot) || !java.nio.file.Files.isRegularFile(screenshotPath)
       || java.nio.file.Files.size(screenshotPath) != (screenshot.bytes as long)) {
    throw new GradleException("Missing or changed native client screenshot: $screenshotPath")
    }
   }
   if (clientSmokeScope == 'bore') {
    def expectedPayload = boreAcceptedPayload()
    if (boreInitialCopyProofSha256 == null || !java.nio.file.Files.isRegularFile(boreInitialCopyProofPath)) throw new GradleException('Missing bound Bore prelaunch copy proof')
    def proofBytes = java.nio.file.Files.readAllBytes(boreInitialCopyProofPath)
    if (boreDigest(proofBytes) != boreInitialCopyProofSha256
        || new groovy.json.JsonSlurper().parseText(new String(proofBytes, java.nio.charset.StandardCharsets.UTF_8)) != boreCopyRecord(expectedPayload)) {
     throw new GradleException('Changed/misbound Bore prelaunch copy proof; never compare or restore the played candidate')
    }
   }
    if (clientSmokeScope == 'bore') {
     def tailFile = file("run-clienttest/bore-tail-${result.run_id}.json")
     if (!tailFile.isFile()) throw new GradleException('Missing independent normal-stop Bore tail: ' + tailFile)
     def tail = new groovy.json.JsonSlurper().parse(tailFile, 'UTF-8')
     if (tail.run_id != result.run_id || tail.status != 'STOPPED_UNINSPECTED' || tail.story_complete != true || tail.error != 'NONE') {
      throw new GradleException('Bore native stop failed/incomplete; script result is not accepted evidence')
     }
     def captures = tail.report?.capture_names
     if (!(captures instanceof List) || captures.size() != 10 || captures.toSet().size() != 10) throw new GradleException('Missing exact Bore capture contract')
     captures.each { name ->
      if (result.screenshots.count { java.nio.file.Path.of(it.path as String).fileName.toString() == result.run_id + '-' + name } != 1) {
       throw new GradleException('Missing or repeated exact Bore capture: ' + name)
      }
     }
    }
    if (clientSmokeScope == 'visnet') {
    def tailFile = file("run-clienttest/visnet-tail-${result.run_id}.json")
    if (!tailFile.isFile()) throw new GradleException("Missing independent normal-stop VisNet tail: $tailFile")
    def tail = new groovy.json.JsonSlurper().parse(tailFile, 'UTF-8')
    def last = tail.last_actual_live_POST
    def base = last?.actual_BASE
    def primalTags = ['aer', 'aqua', 'ignis', 'ordo', 'perditio', 'terra'] as Set
    if (tail.run_id != result.run_id || tail.status != 'STOPPED' || !tail.saw_actual_energized || !tail.saw_actual_reversion
        || last?.kind != 'ORDINARY' || last.actual_count >= 1200 || last.actual_type != 'NORMAL' || last.actual_modifier != 'NONE'
        || !(base instanceof List) || base.size() != 6 || (base.collect { it.tag } as Set) != primalTags || base.any { it.amount != 80 }) {
     throw new GradleException("VisNet live tail did not retain its promised pre-prune BASE80 handoff; no clocks/refunds/waivers. Inspect $tailFile and stopped NBT")
    }
   }
    if (clientSmokeScope == 'focal') {
     def tailFile = file("run-clienttest/focal-tail-${result.run_id}.json")
     if (!tailFile.isFile()) throw new GradleException("Missing independent normal-stop focal tail: $tailFile")
     def tail = new groovy.json.JsonSlurper().parse(tailFile, 'UTF-8')
     def finalState = tail.report?.final_native_finite_state
     if (tail.run_id != result.run_id || tail.status != 'STOPPED_UNINSPECTED' || !tail.story_complete
         || tail.error != 'NONE' || tail.report?.INERT_observation_failure
         || tail.last_native_SERVER_POST < tail.first_native_SERVER_POST
         || !finalState || finalState.actual_XP_credited != 112 || finalState.gold_retained != 108
         || finalState.actual_all6_CV_grants != [aer:200, terra:600, ignis:400, aqua:600, ordo:400, perditio:200]) {
      throw new GradleException("Focal tail lacks actual finite XP/payment/normal-stop proof; inspect $tailFile and stopped NBT")
     }
    }
     logger.lifecycle("Client $clientSmokeScope check passed: $expectedCaptures screenshots; visual inspection is still required.")
 }
}
project(':common').configureTestIsolation(project, [gameTest: 'gameTest', clientSmoke: 'clientTest'])
