def clientTestModRoots = files(sourceSets.clientTest.output)
def exampleAddonModRoots = files(sourceSets.exampleAddon.output)
def gameTestFilter = providers.gradleProperty('gameTestFilter').getOrElse('')
// The heap of the GameTest server.
//
// Measured, not guessed: -Xmx2G dies with OutOfMemoryError in the chunk save path
// (ChunkSerializer.write -> ChunkMap.save, which holds the NBT of every generated chunk at
// once) and it dies even on the commit whose CI run was green, so 2G was already borderline
// and the growth of the suite pushed it over. -Xmx2600M passes, -Xmx3G passes repeatedly.
// The GitHub runner has 7 GB, so 3G leaves room for the daemon and the OS.
//
// The final save is still the peak: it serialises roughly 20 000 chunk records in one go.
// docs/analysis/2026-10-23-agent-memory.md measured the cause; shrinking that peak is a
// separate task (the suite would have to release generated chunks as it goes).
def gameTestHeap = providers.gradleProperty('gameTestHeap').getOrElse('3G')
// The multiplayer acceptance talks to an EXTERNAL dedicated server process.
def multiplayerAddress = providers.gradleProperty('multiplayerAddress').getOrElse('127.0.0.1:25565')
def multiplayerPlayer = providers.gradleProperty('multiplayerPlayer').getOrElse('MPProbe')
// The SECOND physical client of the two-player acceptance.
def multiplayerPeerPlayer = providers.gradleProperty('multiplayerPeerPlayer').getOrElse('MPProbe2')
def multiplayerPairDir = file('run-multiplayer/pair').toPath().toAbsolutePath().normalize()
// A partial run still produces its evidence; the acceptance report is the record.
def multiplayerAllowPartial = providers.gradleProperty('multiplayerAllowPartial').isPresent()
// The host shares 15 GB with the other wave agents; the heap of the three
// acceptance processes has to stay small enough to survive the OOM killer.
def multiplayerHeap = providers.gradleProperty('multiplayerHeap').getOrElse('768M')
loom.runs {
 // The development client with the example add-on loaded next to the mod.
 exampleClient {
  client()
  source sourceSets.exampleAddon
  name 'Thaumcraft example add-on client'
  runDir 'run'
  vmArg "-Dfabric.classPathGroups=${exampleAddonModRoots.asPath}"
 }
 gameTest {
  server()
  // The GameTest server generates real chunks for the world generation and
  // structure scenarios. Without an explicit heap the JVM takes a quarter of
  // the machine's RAM, which is about 1.75 GB on the 7 GB CI runner and made
  // the suite die with OutOfMemoryError while saving a chunk. The suite needs
  // a fixed heap, not one that depends on the size of the machine.
  vmArg "-Xmx${gameTestHeap}"
  source sourceSets.gameTest
  name 'Thaumcraft 1.21.1 GameTests'
  vmArg "-Dfabric.classPathGroups=${gameTestModRoots.asPath}"
  vmArg '-Dfabric-api.gametest'
  if (!gameTestFilter.isBlank()) vmArg "-Dthaumcraft.gameTestFilter=${gameTestFilter}"
  vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file(gameTestFilter.isBlank() ? 'gametest-results.xml' : 'gametest-focused-results.xml').get().asFile.absolutePath}"
  runDir 'run-gametest'
 }
 clientSmoke {
  client()
  source sourceSets.clientTest
  name 'Thaumcraft isolated book client smoke'
  runDir 'run-clienttest'
  vmArg "-Dfabric.classPathGroups=${clientTestModRoots.asPath}"
  vmArg '-Dthaumcraft.clientSmoke=true'
  vmArg "-Dthaumcraft.clientSmokeScope=$clientSmokeScope"
  vmArg "-Dthaumcraft.clientSmokeEquipmentOrigin=$clientSmokeEquipmentOrigin"
  vmArg "-Dthaumcraft.clientSmokeInfusionCenter=$clientSmokeInfusionCenter"
   programArgs '--quickPlaySingleplayer', clientSmokeWorld, '--width', '1280', '--height', '720'
   if (clientSmokeScope == 'bore') {
    programArgs '--username', 'Player653', '--uuid', '13848433-7be7-350d-8b4a-c038819c2260'
   }
 }
 // Real dedicated-server multiplayer acceptance. The client joins an EXTERNAL
 // server process over the loopback socket; nothing of the client smoke is
 // reused and the harness never ships in a production archive.
 multiplayerClient {
  client()
  source sourceSets.clientTest
  name 'Thaumcraft dedicated-server multiplayer client'
  runDir 'run-multiplayer'
  vmArg "-Xmx$multiplayerHeap"
  vmArg '-Xms192M'
  vmArg "-Dfabric.classPathGroups=${clientTestModRoots.asPath}"
  vmArg '-Dthaumcraft.multiplayerClient=true'
  vmArg "-Dthaumcraft.multiplayerRunDir=${file('run-multiplayer').toPath().toAbsolutePath().normalize()}"
  vmArg "-Dthaumcraft.multiplayerReport=multiplayer-client-report.json"
  vmArg "-Dthaumcraft.multiplayerPlayer=$multiplayerPlayer"
  vmArg "-Dthaumcraft.multiplayerAddress=$multiplayerAddress"
  vmArg "-Dthaumcraft.multiplayerPairDir=${multiplayerPairDir}"
  vmArg "-Dthaumcraft.multiplayerPeer=$multiplayerPeerPlayer"
  programArgs '--username', multiplayerPlayer, '--quickPlayMultiplayer', multiplayerAddress, '--width', '854', '--height', '480'
 }
 // The SECOND physical client of the two-player acceptance. It is a real
 // client in its own JVM with its own payload registry and its own GL context.
 multiplayerPeerClient {
  client()
  source sourceSets.clientTest
  name 'Thaumcraft dedicated-server multiplayer peer client'
  runDir 'run-multiplayer-peer'
  vmArg "-Xmx$multiplayerHeap"
  vmArg '-Xms192M'
  vmArg "-Dfabric.classPathGroups=${clientTestModRoots.asPath}"
  vmArg '-Dthaumcraft.multiplayerPeer=true'
  vmArg "-Dthaumcraft.multiplayerRunDir=${file('run-multiplayer-peer').toPath().toAbsolutePath().normalize()}"
  vmArg "-Dthaumcraft.multiplayerReport=multiplayer-peer-report.json"
  vmArg "-Dthaumcraft.multiplayerPlayer=$multiplayerPeerPlayer"
  vmArg "-Dthaumcraft.multiplayerAddress=$multiplayerAddress"
  vmArg "-Dthaumcraft.multiplayerPairDir=${multiplayerPairDir}"
  programArgs '--username', multiplayerPeerPlayer, '--quickPlayMultiplayer', multiplayerAddress, '--width', '854', '--height', '480'
 }
 // The dedicated server the multiplayer acceptance talks to. A small heap
 // keeps the two acceptance processes inside the host memory budget.
 multiplayerServer {
  server()
  name 'Thaumcraft dedicated-server multiplayer target'
  runDir 'run-multiplayer-server'
  // The server of the two-player acceptance shares the host with two physical
  // clients, so it gets the smaller heap of the three processes.
  vmArg '-Xmx640M'
  vmArg '-Xms192M'
  programArgs '--nogui'
 }
}
tasks.named('runGameTest') {
 dependsOn tasks.named('gameTestClasses'), project(':common').tasks.named('gameTestClasses')
 // Diagnostic selection only: -PgameTestFilter=<test name> runs a single case.
 // The default run still requires every authored case.
 if (project.hasProperty('gameTestFilter')) {
  systemProperty 'thaumcraft.gameTestFilter', project.property('gameTestFilter')
 }
}
// Bore checks immutable parent/prelaunch evidence, never equality after play.
def clientSmokeTargetWorld = file('run-clienttest/saves/' + clientSmokeWorld).toPath().toAbsolutePath().normalize()
def boreAcceptedManifestPath = rootProject.file('.tmp/bore-accepted-parent-before-client.json').toPath().toAbsolutePath().normalize()
def boreAcceptedManifestSha256 = 'cbcb22db9beb7056d0a61d08852bfb5bd5df38d22c58e78baa4d7de24ba58fd3'
def boreInitialCopyProofPath = file("run-clienttest/bore-initial-copy-${clientSmokeWorld}.json").toPath().toAbsolutePath().normalize()
def boreInitialCopyProofSha256 = null
def boreDigest = { byte[] bytes -> java.util.HexFormat.of().formatHex(java.security.MessageDigest.getInstance('SHA-256').digest(bytes)) }
def borePayloadHashes = { java.nio.file.Path world ->
 def lock = world.resolve('session.lock')
 if (java.nio.file.Files.exists(lock) && !java.util.Arrays.equals(java.nio.file.Files.readAllBytes(lock), '☃'.getBytes(java.nio.charset.StandardCharsets.UTF_8))) throw new GradleException('Unexpected native root session.lock bytes')
 def paths = java.nio.file.Files.walk(world)
 def payload = new TreeMap()
 try {
   paths.filter { java.nio.file.Files.isRegularFile(it) && it != lock }.forEach { path ->
   payload[world.relativize(path).toString().replace('\\', '/')] = boreDigest(java.nio.file.Files.readAllBytes(path))
  }
 } finally { paths.close() }
 payload
}
def boreAcceptedPayload = {
 if (!java.nio.file.Files.isRegularFile(boreAcceptedManifestPath)) throw new GradleException('Missing accepted focal payload manifest; do not invent another source')
 def manifestBytes = java.nio.file.Files.readAllBytes(boreAcceptedManifestPath)
 if (boreDigest(manifestBytes) != boreAcceptedManifestSha256) throw new GradleException('Changed accepted focal payload manifest; do not invent another source')
 def manifest = new groovy.json.JsonSlurper().parseText(new String(manifestBytes, java.nio.charset.StandardCharsets.UTF_8))
 if (!(manifest.source_save instanceof String) || rootProject.file(manifest.source_save).toPath().toAbsolutePath().normalize() != clientSmokeSourceWorld
     || !(manifest.source_save_files_sha256 instanceof Map) || manifest.source_save_files_sha256.size() != 191) throw new GradleException('Wrong Bore source-save binding')
 def expected = new TreeMap()
 manifest.source_save_files_sha256.each { name, hash ->
  def original = rootProject.file(name as String).toPath().toAbsolutePath().normalize()
  if (!original.startsWith(clientSmokeSourceWorld) || original == clientSmokeSourceWorld || original.fileName.toString() == 'session.lock'
      || !(hash instanceof String) || !(hash ==~ /[0-9a-f]{64}/)) throw new GradleException('Invalid accepted parent payload entry: ' + name)
  expected[clientSmokeSourceWorld.relativize(original).toString().replace('\\', '/')] = hash
 }
 if (expected.size() != 191 || borePayloadHashes(clientSmokeSourceWorld) != expected) throw new GradleException('Accepted parent changed bytes or gained/lost payload files')
 expected
}
def boreCopyRecord = { Map payload ->
 [schema: 'bore-initial-copy-v1', scope: 'bore', client_smoke_world: clientSmokeWorld,
  source_save: clientSmokeSourceWorld.toString().replace('\\', '/'), target_save: clientSmokeTargetWorld.toString().replace('\\', '/'),
  accepted_manifest: boreAcceptedManifestPath.toString().replace('\\', '/'), accepted_manifest_sha256: boreAcceptedManifestSha256,
  payload_count: payload.size(), payload_files_sha256: payload]
}
tasks.register('prepareClientSmokeWorld') {
 group = 'verification'
 description = 'Copy the existing 1.21.1 test world into the isolated client smoke directory once.'
 doLast {
   // Focused checks copy the real accepted save, including its actual earned
   // inventory, into a fresh owned world. Never overwrite/replay that source.
    def sourceWorld = clientSmokeSourceWorld
    def boreExpectedPayload = clientSmokeScope == 'bore' ? boreAcceptedPayload() : null
  def isolatedRoot = file('run-clienttest').toPath().toAbsolutePath().normalize()
   def targetWorld = clientSmokeTargetWorld
   if (!targetWorld.startsWith(isolatedRoot) || targetWorld == sourceWorld) {
    throw new GradleException('Client smoke world must stay inside fabric/run-clienttest')
   }
   if (clientSmokeScope == 'bore' && java.nio.file.Files.exists(targetWorld)) {
    throw new GradleException('Bore always requires a NEW private copy, never an existing or failed attempt: ' + targetWorld)
   }
  if (!java.nio.file.Files.isRegularFile(targetWorld.resolve('level.dat'))) {
   if (java.nio.file.Files.exists(targetWorld)) {
    throw new GradleException("Refusing to overwrite an incomplete smoke world: $targetWorld")
   }
   if (!java.nio.file.Files.isRegularFile(sourceWorld.resolve('level.dat'))) {
    throw new GradleException("The private 1.21.1 fixture world is absent: $sourceWorld")
   }
    copy {
    from sourceWorld.toFile()
    into targetWorld.toFile()
     exclude '**/session.lock', 'session.lock'
    }
    if (clientSmokeScope == 'bore') {
     def copiedPayload = borePayloadHashes(targetWorld)
     if (copiedPayload != boreExpectedPayload) throw new GradleException('Fresh Bore copy does not match the exact accepted 191-file payload')
     def proofBytes = (groovy.json.JsonOutput.toJson(boreCopyRecord(copiedPayload)) + '\n').getBytes(java.nio.charset.StandardCharsets.UTF_8)
     java.nio.file.Files.write(boreInitialCopyProofPath, proofBytes, java.nio.file.StandardOpenOption.CREATE_NEW, java.nio.file.StandardOpenOption.WRITE)
     boreInitialCopyProofSha256 = boreDigest(proofBytes)
    }
  }
  def optionsFile = isolatedRoot.resolve('options.txt').toFile()
  // This is an owned test directory: reset the locale/viewport on every run.
     // Old stock jars span chunks91..115 while the action route spans91..101.
     // Normal finite radius26 leaves a two-chunk margin; observers still require
     // actual availability/ticking and never load/ticket missing chunks.
     def ownedRadius = clientSmokeScope == 'bore' ? 'renderDistance:26\nsimulationDistance:26\n' : clientSmokeScope == 'focal' ? 'renderDistance:8\nsimulationDistance:8\n' : 'renderDistance:4\nsimulationDistance:5\n'
   optionsFile.setText('onboardAccessibility:false\nlang:en_us\nguiScale:2\npauseOnLostFocus:false\n' + ownedRadius + 'maxFps:60\ntutorialStep:none\nnarrator:0\n', 'UTF-8')
 }
}
tasks.named('runClientSmoke') {
 dependsOn tasks.named('prepareClientSmokeWorld'), tasks.named('clientTestClasses')
 doFirst {
  def smokeRunId = 'client-smoke-' + java.util.UUID.randomUUID().toString()
  extensions.extraProperties.set('clientSmokeRunId', smokeRunId)
   systemProperty 'thaumcraft.clientSmokeRunId', smokeRunId
   systemProperty 'thaumcraft.clientSmokeScope', clientSmokeScope
  file('run-clienttest/client-smoke-result.json').setText(groovy.json.JsonOutput.toJson([
    status: 'LAUNCHING', run_id: smokeRunId, visual_inspection: 'pending'
  ]) + '\n', 'UTF-8')
 }
 doLast {
  def resultFile = file('run-clienttest/client-smoke-result.json')
  def result = new groovy.json.JsonSlurper().parse(resultFile, 'UTF-8')
   if (result.run_id != extensions.extraProperties.get('clientSmokeRunId') || result.status != 'SCRIPT_PASSED' || result.scope != clientSmokeScope) {
   throw new GradleException("Client smoke failed or did not produce fresh evidence; inspect $resultFile")
  }
          def expectedCaptures = clientSmokeScope == 'researchhands' ? 4 : clientSmokeScope in ['visuals', 'visnet', 'focal', 'bore'] ? 10 : clientSmokeScope in ['tubefilter', 'buffer', 'centrifuge', 'crystallizer', 'stabilizer'] ? 8 : clientSmokeScope in ['voidjar', 'valve'] ? 7 : clientSmokeScope == 'frost' ? 5 : clientSmokeScope == 'excavation' ? 6 : clientSmokeScope == 'clothing' ? 8 : clientSmokeScope in ['caps', 'goggles'] ? 7 : clientSmokeScope == 'equipment' ? 6 : 66
   if (!(result.screenshots instanceof List) || result.screenshots.size() != expectedCaptures) {
     throw new GradleException("Client $clientSmokeScope check did not produce $expectedCaptures screenshots; inspect $resultFile")
   }
   if (clientSmokeScope == 'visuals') {
    def names = ['201-outer-lands-obelisk-tunnel-wide-en.png', '202-outer-lands-obelisk-tunnel-close-en.png',
                 '203-advanced-node-stabilizer-held-en.png', '204-aura-node-held-and-jar-node-en.png',
                 '205-void-robe-front-en.png', '206-void-robe-back-en.png',
                 '207-research-graph-parchment-en.png', '208-candle-crust-stairs-contained-flux-en.png',
                 '209-linked-mirror-projected-field-front-en.png', '210-linked-mirror-projected-field-angle-en.png']
    if (result.screenshots.collect { java.nio.file.Path.of(it.path as String).fileName.toString() } != names.collect { result.run_id + '-' + it }) {
     throw new GradleException('Visual fixture capture names/order do not match the ten-frame contract')
    }
   }
  def screenshotRoot = file('run-clienttest/screenshots').toPath().toAbsolutePath().normalize()
   result.screenshots.each { screenshot ->
   def screenshotPath = java.nio.file.Path.of(screenshot.path as String).toAbsolutePath().normalize()
   if (!screenshotPath.startsWith(screenshotRoot) || !java.nio.file.Files.isRegularFile(screenshotPath)
       || java.nio.file.Files.size(screenshotPath) != (screenshot.bytes as long)) {
    throw new GradleException("Missing or changed native client screenshot: $screenshotPath")
    }
   }
   if (clientSmokeScope == 'bore') {
    def expectedPayload = boreAcceptedPayload()
    if (boreInitialCopyProofSha256 == null || !java.nio.file.Files.isRegularFile(boreInitialCopyProofPath)) throw new GradleException('Missing bound Bore prelaunch copy proof')
    def proofBytes = java.nio.file.Files.readAllBytes(boreInitialCopyProofPath)
    if (boreDigest(proofBytes) != boreInitialCopyProofSha256
        || new groovy.json.JsonSlurper().parseText(new String(proofBytes, java.nio.charset.StandardCharsets.UTF_8)) != boreCopyRecord(expectedPayload)) {
     throw new GradleException('Changed/misbound Bore prelaunch copy proof; never compare or restore the played candidate')
    }
   }
    if (clientSmokeScope == 'bore') {
     def tailFile = file("run-clienttest/bore-tail-${result.run_id}.json")
     if (!tailFile.isFile()) throw new GradleException('Missing independent normal-stop Bore tail: ' + tailFile)
     def tail = new groovy.json.JsonSlurper().parse(tailFile, 'UTF-8')
     if (tail.run_id != result.run_id || tail.status != 'STOPPED_UNINSPECTED' || tail.story_complete != true || tail.error != 'NONE') {
      throw new GradleException('Bore native stop failed/incomplete; script result is not accepted evidence')
     }
     def captures = tail.report?.capture_names
     if (!(captures instanceof List) || captures.size() != 10 || captures.toSet().size() != 10) throw new GradleException('Missing exact Bore capture contract')
     captures.each { name ->
      if (result.screenshots.count { java.nio.file.Path.of(it.path as String).fileName.toString() == result.run_id + '-' + name } != 1) {
       throw new GradleException('Missing or repeated exact Bore capture: ' + name)
      }
     }
    }
    if (clientSmokeScope == 'visnet') {
    def tailFile = file("run-clienttest/visnet-tail-${result.run_id}.json")
    if (!tailFile.isFile()) throw new GradleException("Missing independent normal-stop VisNet tail: $tailFile")
    def tail = new groovy.json.JsonSlurper().parse(tailFile, 'UTF-8')
    def last = tail.last_actual_live_POST
    def base = last?.actual_BASE
    def primalTags = ['aer', 'aqua', 'ignis', 'ordo', 'perditio', 'terra'] as Set
    if (tail.run_id != result.run_id || tail.status != 'STOPPED' || !tail.saw_actual_energized || !tail.saw_actual_reversion
        || last?.kind != 'ORDINARY' || last.actual_count >= 1200 || last.actual_type != 'NORMAL' || last.actual_modifier != 'NONE'
        || !(base instanceof List) || base.size() != 6 || (base.collect { it.tag } as Set) != primalTags || base.any { it.amount != 80 }) {
     throw new GradleException("VisNet live tail did not retain its promised pre-prune BASE80 handoff; no clocks/refunds/waivers. Inspect $tailFile and stopped NBT")
    }
   }
    if (clientSmokeScope == 'focal') {
     def tailFile = file("run-clienttest/focal-tail-${result.run_id}.json")
     if (!tailFile.isFile()) throw new GradleException("Missing independent normal-stop focal tail: $tailFile")
     def tail = new groovy.json.JsonSlurper().parse(tailFile, 'UTF-8')
     def finalState = tail.report?.final_native_finite_state
     if (tail.run_id != result.run_id || tail.status != 'STOPPED_UNINSPECTED' || !tail.story_complete
         || tail.error != 'NONE' || tail.report?.INERT_observation_failure
         || tail.last_native_SERVER_POST < tail.first_native_SERVER_POST
         || !finalState || finalState.actual_XP_credited != 112 || finalState.gold_retained != 108
         || finalState.actual_all6_CV_grants != [aer:200, terra:600, ignis:400, aqua:600, ordo:400, perditio:200]) {
      throw new GradleException("Focal tail lacks actual finite XP/payment/normal-stop proof; inspect $tailFile and stopped NBT")
     }
    }
     logger.lifecycle("Client $clientSmokeScope check passed: $expectedCaptures screenshots; visual inspection is still required.")
 }
}
