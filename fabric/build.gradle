plugins { id 'com.github.johnrengelman.shadow' }
architectury { platformSetupLoomIde(); fabric() }
loom { accessWidenerPath = project(':common').loom.accessWidenerPath }
configurations {
 common { canBeResolved = true; canBeConsumed = false }
 compileClasspath.extendsFrom common
 runtimeClasspath.extendsFrom common
 developmentFabric.extendsFrom common
 shadowBundle { canBeResolved = true; canBeConsumed = false }
}
dependencies {
 modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
 modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
 modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
 common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
 shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
 // Optional integrations: compile against the APIs only, never bundle or require them.
 modCompileOnly "dev.emi:emi-fabric:$rootProject.emi_version:api"
 modCompileOnly "com.terraformersmc:modmenu:$rootProject.modmenu_version"
 modCompileOnly "maven.modrinth:jade:$rootProject.jade_version+fabric"
 modCompileOnly "mezz.jei:jei-1.21.1-fabric-api:$rootProject.jei_version"
 // `-PwithEmi` / `-PwithModMenu` add the mods to runClient for manual checks; GameTest and
 // the default runs stay without them.
 if (providers.gradleProperty('withEmi').isPresent()) modLocalRuntime "dev.emi:emi-fabric:$rootProject.emi_version"
 if (providers.gradleProperty('withModMenu').isPresent()) modLocalRuntime "com.terraformersmc:modmenu:$rootProject.modmenu_version"
 if (providers.gradleProperty('withJade').isPresent()) modLocalRuntime "maven.modrinth:jade:$rootProject.jade_version+fabric"
 if (providers.gradleProperty('withJei').isPresent()) modLocalRuntime "mezz.jei:jei-1.21.1-fabric:$rootProject.jei_version"
}
processResources {
  // Loader reads AW from THIS mod's roots during dev startup, not an arbitrary
  // common dependency's resources. Keep one authored file in common.
  from(project(':common').loom.accessWidenerPath)
  // Mod Menu reads the icon from this mod's own roots as well: give it the original
  // Thaumonomicon item texture under the path fabric.mod.json names.
  from(project(':common').file('src/main/resources/assets/thaumcraft/textures/items/thaumonomicon.png')) {
   into 'assets/thaumcraft'
   rename { 'icon.png' }
  }
  inputs.property 'version', project.version
 filesMatching('fabric.mod.json') { expand version: project.version }
}
shadowJar {
  configurations = [project.configurations.shadowBundle]; archiveClassifier = 'dev-shadow'
  // Fabric resources and the shared production bundle carry the SAME canonical
  // AW. Deduplicate only that path, never mask unrelated resource collisions.
  filesMatching('thaumcraft.accesswidener') { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
}
remapJar { inputFile.set shadowJar.archiveFile }

// The optional EMI plugin is shared with NeoForge and compiled into each loader module.
sourceSets.main.java.srcDir rootProject.file('compat/emi/src/main/java')
// The optional Jade plugin, shared with NeoForge as well.
sourceSets.main.java.srcDir rootProject.file('compat/jade/src/main/java')
// The optional JEI plugin, shared with NeoForge as well.
sourceSets.main.java.srcDir rootProject.file('compat/jei/src/main/java')

// Opt-in harnesses. Neither output is included by jar/shadowJar or normal runs.
sourceSets {
 gameTest {
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + project(':common').sourceSets.gameTest.output
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath + project(':common').sourceSets.gameTest.output
 }
 clientTest {
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 }
 // The example add-on of docs/api/PORTING.md: a separate mod written against thaumcraft.api only
 // (ExampleAddonApiOnlyTest enforces it). Compiled by every build, loaded only by runExampleClient.
 exampleAddon {
  java.srcDir rootProject.file('examples/example-addon/src/main/java')
  resources.srcDir rootProject.file('examples/example-addon/src/main/resources')
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 }
}
