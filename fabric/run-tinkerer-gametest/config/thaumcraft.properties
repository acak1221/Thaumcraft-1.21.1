# Thaumcraft server research settings; restart required.
# research_difficulty: -1 purchases all, 0 purchases Secondary, 1 uses notes for all.
allow_cheat_sheet=false
allow_warded_stone=true
allow_mirrors=true
hard_mode_nodes=true
wuss_mode=false
research_difficulty=0
aspect_total_cap=100
aspect_inference=true
biome_taint_spread=200
spawn_taint_spores=true
glowing_taint=true
magical_forest_biome_weight=5
taint_biome_weight=2
blue_magical_forest=false
spawn_angry_zombies=true
spawn_pechs=true
spawn_fire_bats=true
spawn_wisps=true
spawn_eldercreatures=true
spawn_taintacles=true
generate_trees=true
generate_taint=true
generate_aura_nodes=true
generate_structures=true
generate_cinnibar_ore=true
generate_amber_ore=true
generate_infused_stone=true
# The regeneration category of the original: every option is off, so the chunk
# regeneration of the original never touches a chunk until one of them is on.
regen_key=DEFAULT
aura_nodes=false
structures=false
cinnibar_ore=false
amber_ore=false
infused_stone=false
trees=false
shaders=true
# Improvements adopted from TC4Tweaks; false (earth_shock_targets=0) is the original rule.
more_randomized_loot=true
earth_shock_targets=2
infusion_keeps_item_data=true
filled_container_to_hand=true
research_search=true
research_counter=true
notification_clear_button=true
# The port's own Thaumonomicon conveniences; false is the original book.
research_remember_page=true
research_keyboard=true
research_bookmarks=true
