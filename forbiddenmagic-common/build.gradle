// Forbidden Magic addon, platform-agnostic module. Mirrors the dependency shape of
// ../common/build.gradle, trimmed of the host's own production-jar/test-isolation
// scanning (there is no addon platform jar yet; that machinery is :common/:fabric's own).
architectury { common rootProject.enabled_platforms.split(',') }

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"
    // thaumcraft.api only: the addon compiles and tests against the host's public API
    // and must not bundle host classes into its own jar (compileOnly, not modImplementation).
    compileOnly project(path: ':common', configuration: 'namedElements')
    testImplementation project(path: ':common', configuration: 'namedElements')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
