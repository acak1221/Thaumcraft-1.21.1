plugins { id 'com.github.johnrengelman.shadow' }
architectury { platformSetupLoomIde(); neoForge() }
// Diagnostic selection only: -PgameTestFilter=<scenario>[,<scenario>...] runs the
// named scenarios alone. The default run still requires every authored case.
def gameTestFilter = providers.gradleProperty('gameTestFilter').getOrElse('')
configurations {
 common { canBeResolved = true; canBeConsumed = false }
 compileClasspath.extendsFrom common
 runtimeClasspath.extendsFrom common
 developmentNeoForge.extendsFrom common
 shadowBundle { canBeResolved = true; canBeConsumed = false }
}
dependencies {
 neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
 modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"
 common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
 shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
 // Optional EMI integration: compile against the API only, never bundle or require it.
 // `-PwithEmi` adds EMI to runClient for manual checks; GameTest and default runs stay without it.
 modCompileOnly "dev.emi:emi-neoforge:$rootProject.emi_version:api"
 if (providers.gradleProperty('withEmi').isPresent()) modLocalRuntime "dev.emi:emi-neoforge:$rootProject.emi_version"
 // Optional Jade integration, the same way; `-PwithJade` adds Jade to runClient.
 modCompileOnly "maven.modrinth:jade:$rootProject.jade_version+neoforge"
 if (providers.gradleProperty('withJade').isPresent()) modLocalRuntime "maven.modrinth:jade:$rootProject.jade_version+neoforge"
 // Optional JEI integration, the same way; `-PwithJei` adds JEI to runClient.
 modCompileOnly "mezz.jei:jei-1.21.1-neoforge-api:$rootProject.jei_version"
 if (providers.gradleProperty('withJei').isPresent()) modLocalRuntime "mezz.jei:jei-1.21.1-neoforge:$rootProject.jei_version"
 // The loader parity test compares the two loader modules source against source.
 testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
 testImplementation 'org.junit.platform:junit-platform-launcher'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
 // The mod list reads the logo from this mod's own roots. In development the shared resources
 // are a separate generated mod, so give NeoForge its own copy, as Fabric does for Mod Menu.
 from(project(':common').file('src/main/resources/assets/thaumcraft/textures/items/thaumonomicon.png')) {
  into 'assets/thaumcraft'
  rename { 'icon.png' }
 }
 inputs.property 'version', project.version
 filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
shadowJar { configurations = [project.configurations.shadowBundle]; archiveClassifier = 'dev-shadow' }
remapJar { inputFile.set shadowJar.archiveFile }

// The optional EMI plugin, shared with Fabric (compat/emi).
sourceSets.main.java.srcDir rootProject.file('compat/emi/src/main/java')
// The optional Jade plugin, shared with Fabric (compat/jade).
sourceSets.main.java.srcDir rootProject.file('compat/jade/src/main/java')
// The optional JEI plugin, shared with Fabric (compat/jei).
sourceSets.main.java.srcDir rootProject.file('compat/jei/src/main/java')

sourceSets {
 gameTest {
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + project(':common').sourceSets.gameTest.output
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath + project(':common').sourceSets.gameTest.output
 }
}

loom.runs {
 gameTest {
  server()
  // A fixed heap, for the same reason as the Fabric run: the suite generates
  // real chunks and must not depend on the size of the machine. Measured on
  // Fabric, and the same generator: -Xmx2G dies in the chunk save path
  // (ChunkSerializer.write -> ChunkMap.save), which serialises every generated
  // chunk at once; -Xmx2600M passes. 3G leaves room on a 7 GB runner.
  vmArg '-Xmx3G'
  source sourceSets.gameTest
  // Common main is supplied by Architectury's transformed dependency JAR.
  // Registering its raw output here would duplicate that generated JPMS module.
  mods {
   thaumcraft {
    sourceSet sourceSets.main
   }
   thaumcraft_gametest {
    sourceSet sourceSets.gameTest
    sourceSet project(':common').sourceSets.gameTest, project(':common')
   }
  }
  name 'Thaumcraft 1.21.1 NeoForge GameTests'
  vmArg '-Dneoforge.enableGameTest=true'
  vmArg '-Dneoforge.gameTestServer=true'
  vmArg '-Dneoforge.enabledGameTestNamespaces=thaumcraft'
  vmArg "-Dthaumcraft.gametest.report-file=${layout.buildDirectory.file(gameTestFilter.isBlank() ? 'gametest-results.xml' : 'gametest-focused-results.xml').get().asFile.absolutePath}"
  // Focused diagnostics, the same convention as the Fabric harness:
  // -PgameTestFilter=<scenario>[,<scenario>...] runs only the named scenarios.
  // The default run still requires every authored case.
  if (!gameTestFilter.isBlank()) vmArg "-Dthaumcraft.gameTestFilter=${gameTestFilter}"
  runDir 'run-gametest'
 }
}
tasks.named('runGameTest') {
 dependsOn tasks.named('gameTestClasses'), project(':common').tasks.named('gameTestClasses')
}

project(':common').configureTestIsolation(project, [gameTest: 'gameTest'])

// Add-on authors compile against the mod jar; its sources jar carries the shared code too, the public
// thaumcraft.api among it, so an IDE shows the documented API rather than decompiled classes.
sourcesJar {
 def commonSources = project(':common').tasks.named('sourcesJar')
 dependsOn commonSources
 from(commonSources.flatMap { it.archiveFile }.map { zipTree(it) }) { include '**/*.java' }
 duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// `./gradlew :neoforge:publishToMavenLocal` installs the jar and its sources for an add-on build.
publishing {
 publications {
  mavenNeoForge(MavenPublication) {
   artifactId = rootProject.archives_name + '-neoforge'
   from components.java
  }
 }
}
