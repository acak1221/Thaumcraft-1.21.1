# NeoForge has no access widener. These three entries are the exact NeoForge
# equivalent of common/src/main/resources/thaumcraft.accesswidener, which the
# Fabric loader applies at runtime. Without them the shared module would fail
# with an IllegalAccessError on NeoForge.
#
# 1.21.1 Projectile's package-private constructor blocks a direct subclass.
# Keep its native ownership/base tick, without ThrowableProjectile's cached
# pre-impact movement overriding Frost's original post-bounce flight order.
public net.minecraft.world.entity.projectile.Projectile <init>(Lnet/minecraft/world/entity/EntityType;Lnet/minecraft/world/level/Level;)V
# Original Gather accepts pickupDelay < 5, not only fully expired player delay.
public net.minecraft.world.entity.item.ItemEntity pickupDelay
# The golem visor marks its victim as recently struck (original EntityUtils.setRecentlyHit(victim, 100)).
public net.minecraft.world.entity.LivingEntity lastHurtByPlayerTime
